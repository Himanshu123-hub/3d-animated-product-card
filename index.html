
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <div class="card">

            <div class="circle"></div>

            <div class="badge">NEW ARRIVAL</div>

            <div class="product-image">
                <img
                    src="./Orange Accent High-Top Sneaker.png"
                    alt="Red Nike sneaker"
                >
            </div>

            <div class="content">

                <h2>NIKE AIR MAX</h2>

                <p class="category">Premium Running Shoes</p>

                <div class="rating">★★★★★</div>

                <p class="description">
                    Experience ultimate comfort and style
                    with our premium sports sneakers.
                </p>

                <div class="price">
                    <h3>$149.99</h3>
                    <span>$199.99</span>
                </div>

                <div class="buttons">
                    <button class="cart">ADD TO CART</button>
                    <button class="buy">BUY NOW</button>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
